<script>
  const searchData = JSON.parse("[{\"title\":\"Документація Мавки 0.125.0\",\"content\":\"# Вступ\\n\\nМавка є простою, зручною та динамічною мовою програмування на основі дієкоду, української мови та моєї свідомості.\\n\\nПричиною створення Мавки є моє бажання до написання програм українською мовою.\\n\\nМавка присвячується Лесі Українці.\\n\\nЯ вірю, що кожен українець має право користуватись звичними йому інструментами в щоденному житті.\\n\",\"path\":\"index.html\"},{\"title\":\"Перша програма | Документація Мавки 0.125.0\",\"content\":\"# Перша програма\\n\\nСтворіть файл `привіт.м`:\\n\\n```мавка\\nдія привітатись()\\n  друк(\\\"Вітання з моєї першої дії!\\\")\\nкінець\\n\\nпривітатись()\\n```\\n\\nЗапустіть, виконавши цю команду:\\n\\n```shell\\nмавка привіт.м\\n```\\n\\n---\\n\\nЯкщо ви замітили щось, що працює дивно або неправильно, повідомте на GitHub-і: [github.com/mavka-ukr/mavka](https://github.com/mavka-ukr/mavka).\\n\",\"path\":\"перша-програма.html\"},{\"title\":\"Призначення діячів | Документація Мавки 0.125.0\",\"content\":\"# Призначення діячів\\n\\nВручну призначити в Мавці можна використовуючи знак `=`:\\n\\n```мавка\\nкіт_моєї_сестри = Кіт(\\\"Тимофій\\\")\\n```\\n\\n```мавка\\nчисло_пі_наближено = 3.14159\\nдві_третини = 2 / 3\\n```\\n\\n```мавка\\nм = 5.97219 * 10 ** 24\\nшс = 299792458\\nЕ = м * шс ** 2\\n```\\n\\nЗвернутись до діяча можна з поточної дійсності або із зовнішньої:\\n\\n```мавка\\nа = 2\\n\\nдія ф()\\n  б = 3\\n\\n  друк(а) ;; 2\\nкінець\\n\\nф()\\n\\nдрук(а) ;; 2\\n\\nдрук(б) ;; помилка\\n```\\n\\nІснують також допоміжні оператори `+=`, `-=`, `*=`, `/=`, `%=`, `**=` що\\nдозволяють простіше призначити в поточній дійсності із застосуванням до значення арифметичних дій:\\n\\n```мавка\\nа = 2\\n\\nа += 3 ;; те саме що а = а + 3\\n\\nдрук(а) ;; 5\\n```\\n\",\"path\":\"призначення-діячів.html\"},{\"title\":\"Створення дій | Документація Мавки 0.125.0\",\"content\":\"# Створення дій\\n\\nЗаписати створення дії в Мавці можна так:\\n\\n```мавка\\nдія(а, б)\\n  вернути а + б\\nкінець\\n```\\n\\nЯкщо додати назву до цього запису, то після створення її буде відразу призначено в поточній дійсності:\\n\\n```мавка\\nдія додати(а, б)\\n  вернути а + б\\nкінець\\n```\\n\\nТакож можна створити дію без параметрів та/або без результату:\\n\\n```мавка\\nдія привіт()\\n  друк(\\\"Привіт!\\\")\\nкінець\\n```\\n\\n```мавка\\nдія привіт(імʼя)\\n  друк(\\\"%(імʼя) вітає!\\\")\\nкінець\\n```\\n\\nІснує також короткий запис створення дії:\\n\\n```мавка\\nдія(а, б): а + б\\n```\\n\\n> Операція `вернути` дозволяє перервати поточну діяльність і повернутись (з результатом або без) до місця, де діяльність почато.\\n\",\"path\":\"створення-дій.html\"},{\"title\":\"Здійснення дій | Документація Мавки 0.125.0\",\"content\":\"# Здійснення дій\\n\\nЗаписати здійснення в Мавці можна так:\\n\\n```мавка\\nдодати(2, 2)\\n```\\n\\n```мавка\\nа.б.в(\\\"привіт\\\")\\n\\nс[0](123)\\n\\nс[0](1)(2)(3)\\n\\n;; ...тощо\\n```\\n\\nІснує також можливість назвати задіяні:\\n\\n```мавка\\nдодати(а=2, б=2)\\n```\\n\\nПозиційні задіяні та названі задіяні можна комбінувати, але названі задіяні завжди повинні йти після позиційних:\\n\\n```мавка\\nдодати(2, б=2)\\n```\\n\\n\",\"path\":\"здійснення-дій.html\"},{\"title\":\"Створення класів | Документація Мавки 0.125.0\",\"content\":\"# Створення класів\\n\\nЗаписати створення класу можна так:\\n\\n```мавка\\nклас\\n  прізвище\\n  імʼя\\n  по_батькові\\n  стать\\nкінець\\n```\\n\\nЯкщо до цього запису додати назву класу, то після створення його буде відразу призначено в поточній дійсності:\\n\\n```мавка\\nклас Паспорт\\n  прізвище\\n  імʼя\\n  по_батькові\\n  стать\\nкінець\\n```\\n\\nМожна також створити клас без параметрів:\\n\\n```мавка\\nклас Щось\\nкінець\\n```\\n\\nТакож для класу можна визначити методи:\\n\\n```мавка\\nдія Паспорт.змінити_імʼя(нове_імʼя)\\n  я.імʼя = нове_імʼя\\nкінець\\n```\\n\\nЩоб перевірити чи предмет є певного класу, можна використати операцію `є`:\\n\\n```мавка\\nмій_паспорт = Паспорт(\\n  номер=0,\\n  дата_видачі=\\\"00.00.0000\\\",\\n  прізвище=\\\"Когут\\\",\\n  імʼя=\\\"Давід\\\",\\n  по_батькові=\\\"Богданович\\\",\\n  стать=\\\"чоловік\\\"\\n)\\n\\nдрук(мій_паспорт є Паспорт) ;; дійсне\\n```\\n\\nМетоди класу можна здійснювати від предмета:\\n\\n```мавка\\nмій_паспорт.змінити_імʼя(\\\"Давид\\\")\\n```\\n\\n<!-- ---\\n\\n```мавка\\nструктура Гриб\\n  ;; опис гриба\\nкінець\\n\\nструктура Голова\\n  ;; опис голови\\nкінець\\n\\nструктура Шия\\n  ;; опис шиї\\nкінець\\n\\nструктура Тулуб\\n  ;; опис тулуба\\nкінець\\n\\nструктура Кінцівки\\n  ;; опис кінцівок\\nкінець\\n\\nструктура Тварина\\n  голова\\n  шия\\n  тулуб\\n  кінцівки\\nкінець\\n\\nструктура Людина є Тварина\\n  імʼя\\n  свідомість\\nкінець\\n\\nадам = Людина(\\n  Голова(),\\n  Шия(),\\n  Тулуб(),\\n  Кінцівки(),\\n  \\\"Давид\\\",\\n  недійсне\\n)\\n;; єва = Людина(..., \\\"*\\\", дійсне)\\n\\nдрук(адам є Людина) ;; дійсне\\nдрук(адам є Тварина) ;; дійсне\\nдрук(адам є Гриб) ;; недійсне\\n``` -->\\n\",\"path\":\"створення-класів.html\"},{\"title\":\"Створення предметів | Документація Мавки 0.125.0\",\"content\":\"# Створення предметів\\n\\nЗаписати створення предмета класу можна так само як здійснення\\nдії:\\n\\n```мавка\\nМолекула(атоми=[...])\\n```\\n\\n```мавка\\nКнижка(\\n  назва=\\\"Лісова пісня\\\",\\n  автор=Автор(псевдо=\\\"Леся Українка\\\"),\\n  жанр=\\\"драма\\\"\\n)\\n```\\n\\n```мавка\\nТварина(\\n  вид=\\\"кіт\\\",\\n  імʼя=\\\"Тимофій\\\",\\n  вік=2,\\n  стать=\\\"чоловіча\\\"\\n)\\n```\\n\\nЗаписати створення числа можна так:\\n\\n```мавка\\n1\\n\\n-2\\n\\n'ї'\\n\\n3.14\\n\\n-2.001\\n```\\n\\nЗаписати створення тексту можна так:\\n\\n```мавка\\n\\\"я ю є\\\"\\n\\n\\\"\\\"\\\"Гетьте, думи, ви хмари осінні!\\\"\\\"\\\"\\n```\\n\\nЗаписати створення списку можна так:\\n\\n```мавка\\n[1, 3.14, -2, Людина(), дійсне, \\\"ого!\\\"]\\n```\\n\\nЗаписати створення словника можна так:\\n\\n```мавка\\n{\\\"яблуко\\\" => \\\"фрукт\\\", \\\"машина\\\" => \\\"пристрій\\\"}\\n```\\n\\nЗаписати створення дії можна так:\\n\\n```мавка\\nдія привіт()\\n  друк(\\\"привіт!\\\")\\nкінець\\n```\\n\\n```мавка\\nще_привіт = дія()\\n  друк(\\\"ще привіт!\\\")\\nкінець\\n```\\n\\n```мавка\\nі_ще_привіт = дія(): друк(\\\"і ще привіт!\\\")\\n```\\n\\nЗаписати створення класу можна так:\\n\\n```мавка\\nклас Молекула\\n  атоми\\nкінець\\n```\\n\\nЗаписати створення модуля можна так:\\n\\n```мавка\\nмодуль двигуни\\n  клас ІоннийДвигун\\n    ;; параметри\\n  кінець\\n\\n  клас РеактивнийДвигун\\n    ;; параметри\\n  кінець\\n\\n  дати ІоннийДвигун\\n  дати РеактивнийДвигун\\nкінець\\n```\\n\",\"path\":\"створення-предметів.html\"},{\"title\":\"Отримання властивостей | Документація Мавки 0.125.0\",\"content\":\"# Отримання властивостей\\n\\nОтримати властивість предмета в Мавці можна так:\\n\\n```мавка\\nа.б\\n```\\n\\n```мавка\\nа.б.г\\n```\\n\\n```мавка\\nа.б[г].д.е ;; ...тощо\\n```\\n\\n\\n```мавка\\nклас Потяг\\n  назва\\nкінець\\n\\nпв = Потяг(\\\"Вітер\\\")\\n\\nдрук(пв.назва)\\n```\",\"path\":\"отримання-властивостей.html\"},{\"title\":\"Зміна властивостей | Документація Мавки 0.125.0\",\"content\":\"# Зміна властивостей\\n\\nЗмінити властивість предмета в Мавці можна так:\\n\\n```мавка\\nа.б = \\\"Що це?\\\"\\n```\\n\\n```мавка\\nа.б.г = 3.21\\n```\\n\\n```мавка\\nа.б[г].д.е = 3.21 ;; ...тощо\\n```\\n\\n```мавка\\nклас Потяг\\n  назва\\nкінець\\n\\nпв = Потяг(\\\"Вітер\\\")\\n\\nпв.назва = \\\"Буря\\\"\\n\\nдрук(пв.назва)\\n```\",\"path\":\"зміна-властивостей.html\"},{\"title\":\"Отримання елементів | Документація Мавки 0.125.0\",\"content\":\"# Отримання елементів\\n\\nОтримати елемент предмета в Мавці можна так:\\n\\n```мавка\\nа[б]\\n```\\n\\n```мавка\\nа.б[г].д[е] ;; ...тощо\\n```\\n\\n```мавка\\nмісяці_весни = [\\\"березень\\\", \\\"квітень\\\", \\\"травень\\\"]\\n\\nдрук(місяці_весни[1]) ;; \\\"квітень\\\"\\n```\\n\",\"path\":\"отримання-елементів.html\"},{\"title\":\"Зміна елементів | Документація Мавки 0.125.0\",\"content\":\"# Зміна елементів\\n\\nЗмінити елемент предмета в Мавці можна так:\\n\\n```мавка\\nа[б] = \\\"Що це?\\\"\\n```\\n\\n```мавка\\nа.б[г].д[е] = \\\"Що це?\\\" ;; ...тощо\\n```\\n\\n```мавка\\nмісяці_весни = [\\\"березень\\\", \\\"квітень\\\", \\\"червень\\\"]\\n\\nдрук(місяці_весни[2]) ;; червень\\n\\nмісяці_весни[2] = \\\"травень\\\"\\n\\nдрук(місяці_весни[2]) ;; травень\\n```\\n\",\"path\":\"зміна-елементів.html\"},{\"title\":\"Створення модулів | Документація Мавки 0.125.0\",\"content\":\"# Створення модулів\\n\\nЗаписати створення модуля в Мавці можна так:\\n\\n```мавка\\nмодуль\\n  якийсь_предмет = 2.10\\n\\n  дати якийсь_предмет\\nкінець\\n```\\n\\nЯкщо додати назву до цього запису, то після створення, модуль буде відразу призначено в поточній дійсності:\\n\\n```мавка\\nмодуль якийсь_модуль\\n  якийсь_предмет = 2.10\\n\\n  дати якийсь_предмет\\nкінець\\n```\\n\",\"path\":\"створення-модулів.html\"},{\"title\":\"Створення чисел | Документація Мавки 0.125.0\",\"content\":\"# Створення чисел\\n\\nЗаписати створення числа в Мавці можна так:\\n\\n```мавка\\n0\\n```\\n\\n```мавка\\n1\\n```\\n\\n```мавка\\n-2\\n```\\n\\n```мавка\\n'є'\\n```\\n\\n```мавка\\n3.14\\n```\\n\\n```мавка\\n-2.71828\\n```\\n\",\"path\":\"створення-чисел.html\"},{\"title\":\"Створення текстів | Документація Мавки 0.125.0\",\"content\":\"# Створення текстів\\n\\nЗаписати створення тексту в Мавці можна так:\\n\\n```мавка\\n\\\"Стій, серце, стій! не бийся так шалено.\\\"\\n```\\n\\n```мавка\\n\\\"\\\"\\\"В небі місяць зіходить смутний,\\nПоміж хмарами вид свій ховає,\\nЙого промінь червоний, сумний\\nПоза хмарами світить-палає.\\n\\nМов пожежа на небі горить,\\nЗемлю ж темнії тіні вкривають,\\nЛедве промінь прорветься на мить,\\nЗнову хмари, мов дим, застилають.\\n\\nКрізь темноту самотно зорить\\nОдинокая зірка ясная,\\nЇї промінь так гордо горить,\\nНе страшна їй темнота нічная!\\n\\nГордий промінь в тієї зорі,\\nТа в нім туга палає огниста,\\nІ сіяє та зірка вгорі,\\nМов велика сльоза промениста.\\n\\nЧи над людьми та зірка сумна\\nПроменистими слізьми ридає?\\nЧи того, що самотна вона\\nПо безмірнім просторі блукає?..\\\"\\\"\\\"\\n```\\n\\n> Текст у Мавці використовує [Дієкод](https://xn--80aaf6ah.xn--j1amh/часопис/2025-01-03-%D0%B4%D1%96%D1%94%D0%BA%D0%BE%D0%B4.html)\\n\",\"path\":\"створення-текстів.html\"},{\"title\":\"Створення списків | Документація Мавки 0.125.0\",\"content\":\"# Створення списків\\n\\nЗаписати створення списку в Мавці можна так:\\n\\n```мавка\\n[]\\n```\\n\\n```мавка\\n['а', 31, \\\"привіт\\\", [0, 0, 1], недійсне]\\n```\\n\\n\\nОтримати елемент списку:\\n\\n```мавка\\nсп[0]\\n\\nсп[50]\\n```\\n\\nЗмінити елемент списку:\\n\\n```мавка\\nсп[0] = 64\\n\\nсп[50] = \\\"30 + 20\\\"\\n```\\n\",\"path\":\"створення-списків.html\"},{\"title\":\"Створення словників | Документація Мавки 0.125.0\",\"content\":\"# Створення словників\\n\\nЗаписати створення словника в Мавці можна так:\\n\\n```мавка\\n{}\\n```\\n\\n```мавка\\n{\\n  \\\"істина\\\" => \\\"є\\\",\\n  \\\"свідомість\\\" => \\\"знання\\\",\\n  \\\"організація\\\" => \\\"діячі\\\",\\n  \\\"тридцять\\\" => 30,\\n  40 => \\\"сорок\\\",\\n  50 => 20 + 20\\n}\\n```\\n\\nОтримати елемент словника:\\n\\n```мавка\\nсл[\\\"істина\\\"]\\n\\nсл[50]\\n```\\n\\nЗмінити елемент словника:\\n\\n```мавка\\nсл[\\\"істина\\\"] = \\\"єсть\\\"\\n\\nсл[50] = 30 + 20\\n```\\n\",\"path\":\"створення-словників.html\"},{\"title\":\"Арифметичні дії | Документація Мавки 0.125.0\",\"content\":\"# Арифметичні дії\\n\\nЗапис арифметичних дій над числами відбувається так:\\n\\nДодати:\\n\\n```мавка\\nа + б\\n```\\n\\nВідняти:\\n\\n```мавка\\nа - б\\n```\\n\\nПомножити:\\n\\n```мавка\\nа * б\\n```\\n\\nПоділити:\\n\\n```мавка\\nа / б\\n```\\n\\nПоділити і вернути залишок:\\n\\n```мавка\\nа % б\\n```\\n\\nПіднести до степеня:\\n\\n```мавка\\nа ** б\\n```\\n\",\"path\":\"арифметичні-дії.html\"},{\"title\":\"Двійкові дії | Документація Мавки 0.125.0\",\"content\":\"# Двійкові дії\\n\\nЗапис двійкових дій над числами відбувається так:\\n\\nЗсув вліво:\\n\\n```мавка\\nа << б\\n```\\n\\nЗсув вправо:\\n\\n```мавка\\nа >> б\\n```\\n\\nДвійкове І:\\n\\n```мавка\\nа & б\\n```\\n\\nДвійкове АБО:\\n\\n```мавка\\nа | б\\n```\\n\\nДвійкове виключне АБО:\\n\\n```мавка\\nа ^ б\\n```\\n\\nДвійкове НЕ:\\n\\n```мавка\\n~а\\n```\\n\",\"path\":\"двійкові-дії.html\"},{\"title\":\"Дії порівняння | Документація Мавки 0.125.0\",\"content\":\"# Дії порівняння\\n\\nЗапис порівняльних дій над предметами відбувається так:\\n\\nРівно:\\n\\n```мавка\\nа == б\\n```\\n\\nНе рівно:\\n\\n```мавка\\nа != б\\n```\\n\\nБільше (лише для чисел):\\n\\n```мавка\\nа > б\\n```\\n\\nМенше (лише для чисел):\\n\\n```мавка\\nа < б\\n```\\n\\nНе більше (лише для чисел):\\n\\n```мавка\\nа <= б\\n```\\n\\nНе менше (лише для чисел):\\n\\n```мавка\\nа >= б\\n```\\n\\nЄ (перевірити клас предмета):\\n\\n```мавка\\nа є Число\\n```\\n\\nНе є:\\n\\n```мавка\\nа не є Молекула\\n```\\n\",\"path\":\"дії-порівняння.html\"},{\"title\":\"Логічні дії | Документація Мавки 0.125.0\",\"content\":\"# Логічні дії\\n\\nЗапис логічних дій над предметами відбувається так:\\n\\nІ:\\n\\n```мавка\\nа і б ;; перевіряє чи значення як \\\"а\\\" так і \\\"б\\\" є дійсним\\n```\\n\\nАбо:\\n\\n```мавка\\nа або б ;; перевіряє чи значення \\\"а\\\" або значення \\\"б\\\" є дійсним\\n```\\n\\nНе:\\n\\n```мавка\\nне а ;; перевіряє чи значення \\\"а\\\" не є дійсним\\n```\\n\\n> Важливо: число 0 і пустий текст в Мавці є дійними!\",\"path\":\"логічні-дії.html\"},{\"title\":\"Запис умов | Документація Мавки 0.125.0\",\"content\":\"# Запис умов\\n\\nУмова перевіряє чи значення _є_ **дійсним**.\\n\\nЗаписати умову в Мавці можна так:\\n\\n```мавка\\nа = 10\\n\\nякщо а == 10\\n  друк(\\\"а рівно 10\\\")\\nкінець\\n```\\n\\n```мавка\\nа = 20\\n\\nякщо а == 10\\n  друк(\\\"а рівно 10\\\")\\nінакше якщо а == 20\\n  друк(\\\"а рівно 20\\\")\\nкінець якщо а == 30 або а == 40\\n  друк(\\\"а рівно 30 або 40\\\")\\nкінець\\n```\\n\\n```мавка\\nа = 30\\n\\nякщо а == 10\\n  друк(\\\"а рівно 10\\\")\\nінакше якщо а == 20\\n  друк(\\\"а рівно 20\\\")\\nінакше якщо а > 30 і а < 40\\n  друк(\\\"а більше 20 і менше 40\\\")\\nінакше\\n  друк(\\\"а не рівно 10 і не рівно 20...\\\")\\nкінець\\n```\\n\\nТакож існує короткий запис умови, який відразу вертає значення:\\n\\n```мавка\\nдобре = дійсне\\n\\nа = \\\"добре\\\" якщо добре інакше \\\"недобре\\\"\\n\\nдрук(а) ;; добре\\n```\",\"path\":\"запис-умов.html\"},{\"title\":\"Запис повторів | Документація Мавки 0.125.0\",\"content\":\"# Запис повторів\\n\\nЗаписати повтор з умовою в Мавці можна так:\\n\\n```мавка\\nп = 0\\n\\nпоки п < 10\\n  друк(п)\\n\\n  п += 1\\nкінець\\n```\\n\",\"path\":\"запис-повторів.html\"},{\"title\":\"Запис переборів | Документація Мавки 0.125.0\",\"content\":\"# Запис переборів\\n\\nЗаписати перебір в Мавці можна так:\\n\\n```мавка\\nперебрати 0..10 як п\\n  друк(п)\\nкінець\\n```\\n\\n```мавка\\nперебрати 0..=10 як п\\n  друк(п)\\nкінець\\n```\\n\\n```мавка\\nперебрати [1, 3, 6] як п\\n  друк(п)\\nкінець\\n```\\n\\n`перебрати`, по-суті, є просто надбудовою над `поки`:\\n\\n```мавка\\nзначення = [1, 3, 6]\\n\\nперебір = значення.чародія_перебір()\\n\\nпоки перебір.далі()\\n  п = перебір.значення\\n\\n  друк(п)\\nкінець\\n\\nп = недійсне\\n```\\n\",\"path\":\"запис-переборів.html\"},{\"title\":\"Запис спроб | Документація Мавки 0.125.0\",\"content\":\"# Запис спроб\\n\\nЗаписати спробу в Мавці можна так:\\n\\n```мавка\\nдія полетіти()\\n  впасти \\\"відмова двигуна!\\\"\\nкінець\\n\\nспробувати\\n  полетіти()\\nзловити п\\n  друк(\\\"ой, впали: %(п)\\\")\\nкінець\\n```\\n\",\"path\":\"запис-спроб.html\"},{\"title\":\"Запис коментарів | Документація Мавки 0.125.0\",\"content\":\"# Запис коментарів\\n\\nЗаписати коментар в Мавці можна так:\\n\\n```мавка\\n;; однорядковий коментар\\nсума = дія(а, б): а + б\\n\\n;*\\nкоментар з декількома рядками\\n\\nа\\nб\\nв\\n*;\\nдія привіт()\\n  друк(\\\"привіт\\\") ;; надрукує привіт\\nкінець\\n```\\n\",\"path\":\"запис-коментарів.html\"},{\"title\":\"Чародії | Документація Мавки 0.125.0\",\"content\":\"# Чародії\\n\\n## `чародія`\\n\\nДія `чародія` здійснюється (якщо визначено) під час створення предмета певного класу.\\n\\n```мавка\\nклас Ракета\\n  назва\\nкінець\\n\\nдія Ракета.чародія(назва)\\n  я.назва = \\\"Ракета %(назва)\\\"\\nкінець\\n\\nракета = Ракета(\\\"Реакція\\\")\\n\\nдрук(ракета) ;; Ракета(назва=\\\"Ракета Реакція\\\")\\n```\\n\\n## `чародія_перебір`\\n\\nДія `чародія_перебір` здійснюється для отримання перебору.\\n\\n```мавка\\nклас Машина\\n  елементи\\nкінець\\n\\nдія Машини.чародія_перебір()\\n  ;; тут необхідно вернути перебір\\nкінець\\n\\nмашини = Машини([\\n  ;; ...\\n])\\n\\nперебрати машини як м\\n  ;; ...\\nкінець\\n```\\n\\n## `чародія_діапазон`\\n\\nДія `чародія_діапазон` здійснюється для отримання діапазону.\\n\\n```мавка\\nдіапазон = 0..=10\\n\\n;; те саме що\\n\\nдіапазон = 0.чародія_діапазон(10, включно=дійсне)\\n```\\n\\n## `чародія_число`\\n\\nДія `чародія_число` здійснюється для перетворення значення на число.\\n\\n```мавка\\nдрук(Число.з(\\\"123\\\"))\\n```\\n\\n## `чародія_текст`\\n\\nДія `чародія_текст` здійснюється для перетворення значення на текст.\\n\\n```мавка\\nдрук(Текст.з(123.456))\\n```\\n\",\"path\":\"чародії.html\"},{\"title\":\"Зовнішні модулі | Документація Мавки 0.125.0\",\"content\":\"# Зовнішні модулі\\n\\n```\\nпривіт.м\\nстарт.м\\n```\\n\\nВміст файлу `привіт.м`:\\n\\n```мавка\\nдія привіт()\\n  друк(\\\"Привіт!\\\")\\nкінець\\n\\nдати привіт\\n```\\n\\nМожливі способи взяття модуля `привіт` (файл `старт.м`):\\n\\n```мавка\\nвзяти модуль привіт\\n\\nпривіт.привіт()\\n```\\n\\n```мавка\\nвзяти модуль привіт як суперпривіт\\n\\nсуперпривіт.привіт()\\n```\\n\\n```мавка\\nвзяти модуль привіт [привіт]\\n\\nпривіт()\\n```\\n\\n```мавка\\nвзяти модуль привіт [привіт як суперпривіт]\\n\\nсуперпривіт()\\n```\\n\\n```мавка\\nвзяти модуль назва_підпапки.привіт\\n\\nдрук(привіт)\\n```\\n\",\"path\":\"зовнішні-модулі.html\"},{\"title\":\"Праця з паками | Документація Мавки 0.125.0\",\"content\":\"# Праця з паками\\n\\nПаки зберігаються в теці `паки` в корені проєкту:\\n\\n```\\nпаки/\\n├─ привіт/\\n│  ├─ привіт.м\\nстарт.м\\n```\\n\\nГоловний модуль `привіт.м` пака `привіт`:\\n\\n```мавка\\nдія привіт()\\n  друк(\\\"Привіт!\\\")\\nкінець\\n\\nдати привіт\\n```\\n\\n`старт.м`:\\n\\n```мавка\\nвзяти пак привіт\\n\\nпривіт.привіт()\\n```\\n\",\"path\":\"праця-з-паками.html\"},{\"title\":\"Діалог | Документація Мавки 0.125.0\",\"content\":\"# Діалог\\n\\nДіалог Мавки дозволяє працювати з Мавкою в режимі діалогу. Ви пишете інструкцію,\\nМашина Мавки її виконує й відповідає.\\n\\nДля цього потрібно запускати Мавку без аргументів:\\n\\n```shell\\nмавка\\n```\\n\\n```plaintext\\nДіалог Мавки 0.125.0\\n- сума = дія(а, б): а + б\\nнедійсне\\n- сума(2, 3)\\n5\\n```\\n\",\"path\":\"діалог.html\"},{\"title\":\"дійсне | Документація Мавки 0.125.0\",\"content\":\"# дійсне\\n\\n`дійсне` це безкласове дійсне значення. Усі предмети **є** дійсними.\\n\",\"path\":\"дійсне.html\"},{\"title\":\"недійсне | Документація Мавки 0.125.0\",\"content\":\"# недійсне\\n\\n`недійсне` це безкласове недійсне значення.\\n\",\"path\":\"недійсне.html\"},{\"title\":\"Клас | Документація Мавки 0.125.0\",\"content\":\"# Клас\\n\\n`Клас` це клас всіх класів.\\n\\n```мавка\\nклас Клас\\n  назва\\n  предок\\n  параметри\\nкінець\\n```\\n\\n<!-- ```мавка\\n;; дізнатись клас предмета\\nс = Клас.з([1, 2, \\\"3\\\"]) ;; Список\\n``` -->\",\"path\":\"Клас.html\"},{\"title\":\"Число | Документація Мавки 0.125.0\",\"content\":\"# Число\\n\\n`Число` це клас чисел. Число в Мавці втілено як `р64` (`double`).\\n\\n```мавка\\nклас Число\\nкінець\\n```\\n\\n```мавка\\n;; перетворити предмет на число\\nч = Число.з(\\\"123\\\")\\n```\\n\\n```мавка\\nдія Число.чародія_число()\\n```\\n\\n```мавка\\nдія Число.чародія_текст()\\n```\\n\",\"path\":\"Число.html\"},{\"title\":\"Текст | Документація Мавки 0.125.0\",\"content\":\"# Текст\\n\\n`Текст` це клас всіх текстів.\\n\\n`Текст` використовує [Дієкод](https://xn--80aaf6ah.xn--j1amh/часопис/2025-01-03-%D0%B4%D1%96%D1%94%D0%BA%D0%BE%D0%B4.html).\\n\\n```мавка\\nклас Текст\\n  розмір\\nкінець\\n```\\n\\n```мавка\\n;; перетворити предмет на текст\\nт = Текст.з(123)\\n```\\n\\n```мавка\\nдія Текст.чародія_число()\\n```\\n\\n```мавка\\nдія Текст.чародія_текст()\\n```\\n\\n```мавка\\nдія Текст.чародія_перебір()\\n```\",\"path\":\"Текст.html\"},{\"title\":\"Дія | Документація Мавки 0.125.0\",\"content\":\"# Дія\\n\\n`Дія` це клас предметів які містять опис дій Мавки.\\n\\n```мавка\\nклас Дія\\n  назва\\n  параметри\\n  тип_результату\\n  код\\nкінець\\n```\\n\",\"path\":\"Дія.html\"},{\"title\":\"Список | Документація Мавки 0.125.0\",\"content\":\"# Список\\n\\n`Список` це клас всіх списків.\\n\\n```мавка\\nклас Список\\n  розмір\\nкінець\\n```\\n\\n```мавка\\nдія Список.чародія_текст()\\n```\\n\\n```мавка\\nдія Список.чародія_перебір()\\n```\\n\\n```мавка\\nдія Список.додати(значення)\\n```\\n\\n```мавка\\nдія Список.забрати()\\n```\\n\\n```мавка\\nдія Список.знайти(дія_перевірки)\\n```\\n\\n```мавка\\nдія Список.знайти_позицію(дія_перевірки)\\n```\\n\\n```мавка\\nдія Список.фільтрований(дія_перевірки)\\n```\\n\\n```мавка\\nдія Список.перетворений(дія_перетворення)\\n```\\n\\n```мавка\\nдія Список.обернений()\\n```\\n\\n```мавка\\nдія Список.містить(значення)\\n```\\n\",\"path\":\"Список.html\"},{\"title\":\"Словник | Документація Мавки 0.125.0\",\"content\":\"# Словник\\n\\n`Словник` це клас всіх словників.\\n\\n```мавка\\nклас Словник\\n  розмір\\nкінець\\n```\\n\\n```мавка\\nдія Словник.чародія_текст()\\n```\\n\\n```мавка\\nдія Словник.чародія_перебір()\\n```\\n\\n```мавка\\nдія Словник.ключі()\\n```\\n\\n```мавка\\nдія Словник.значення()\\n```\\n\\n```мавка\\nдія Словник.містить(ключ)\\n```\\n\",\"path\":\"Словник.html\"},{\"title\":\"Модуль | Документація Мавки 0.125.0\",\"content\":\"# Модуль\\n\\n`Модуль` це клас предметів які створюються вертаються після виконання модуля.\\n\\n```мавка\\nклас Модуль\\n  назва\\nкінець\\n```\\n\",\"path\":\"Модуль.html\"},{\"title\":\"Дані | Документація Мавки 0.125.0\",\"content\":\"# Дані\\n\\n`Дані` це клас предметів які зберігають сирі дані у вигляді байтів.\\n\\n```мавка\\nклас Дані\\n  розмір\\nкінець\\n```\\n\\n```мавка\\nдія Дані.чародія_перебір()\\n```\\n\\n```мавка\\n;; виділити дані вказаного розміру\\nд = Дані(128)\\n```\\n\\n```мавка\\n;; отримати елемент даних\\nдрук(д[18])\\n```\\n\\n```мавка\\n;; змінити елемент даних\\nд[18] = 122\\n```\\n\\n```мавка\\n;; перебрати дані\\nперебрати д як б\\n  друк(б)\\nкінець\\n```\",\"path\":\"Дані.html\"},{\"title\":\"ДіапазонЧисел | Документація Мавки 0.125.0\",\"content\":\"# ДіапазонЧисел\\n\\n`ДіапазонЧисел` це клас предметів які зберігають діапазон чисел.\\n\\n```мавка\\nклас ДіапазонЧисел\\n  від\\n  до\\n  включно\\nкінець\\n```\\n\\n```мавка\\nдія ДіапазонЧисел.чародія_перебір()\\n```\\n\",\"path\":\"ДіапазонЧисел.html\"},{\"title\":\"Код | Документація Мавки 0.125.0\",\"content\":\"# Код\\n\\n`Код` це клас предметів які містять виконуваний код Машини Мавки.\\n\\n```мавка\\nклас Код\\n  константи\\n  вказівки\\n  шлях\\n  місцезнаходження_вказівок\\nкінець\\n```\\n\",\"path\":\"Код.html\"},{\"title\":\"Параметр | Документація Мавки 0.125.0\",\"content\":\"# Параметр\\n\\n`Параметр` це клас всіх параметрів.\\n\\n```мавка\\nклас Параметр\\n  назва\\n  тип\\n  дія_значення\\nкінець\\n```\\n\",\"path\":\"Параметр.html\"},{\"title\":\"ПеребірДаних | Документація Мавки 0.125.0\",\"content\":\"# ПеребірДаних\\n\\n`ПеребірДаних` це клас всіх переборів даних.\\n\\n```мавка\\nклас ПеребірДаних\\n  значення\\n  дані\\n  позиція\\nкінець\\n```\\n\\n```мавка\\nдія ПеребірДаних.далі()\\n```\\n\",\"path\":\"ПеребірДаних.html\"},{\"title\":\"ПеребірДіапазонуЧисел | Документація Мавки 0.125.0\",\"content\":\"# ПеребірДіапазонуЧисел\\n\\n`ПеребірДіапазонуЧисел` це клас всіх переборів діапазону чисел.\\n\\n```мавка\\nклас ПеребірДіапазонуЧисел\\n  значення\\n  діапазон\\nкінець\\n```\\n\\n```мавка\\nдія ПеребірДіапазонуЧисел.далі()\\n```\\n\",\"path\":\"ПеребірДіапазонуЧисел.html\"},{\"title\":\"ПеребірПослідовності | Документація Мавки 0.125.0\",\"content\":\"# ПеребірПослідовності\\n\\n`ПеребірПослідовності` це клас всіх переборів послідовності.\\n\\n```мавка\\nклас ПеребірПослідовності\\n  значення\\n  послідовність\\n  позиція\\nкінець\\n```\\n\\n```мавка\\nдія ПеребірПослідовності.далі()\\n```\\n\",\"path\":\"ПеребірПослідовності.html\"},{\"title\":\"ПеребірСловника | Документація Мавки 0.125.0\",\"content\":\"# ПеребірСловника\\n\\n`ПеребірСловника` це клас всіх переборів словника.\\n\\n```мавка\\nклас ПеребірСловника\\n  значення\\n  словник\\nкінець\\n```\\n\\n```мавка\\nдія ПеребірСловника.далі()\\n```\\n\",\"path\":\"ПеребірСловника.html\"},{\"title\":\"ПеребірСписку | Документація Мавки 0.125.0\",\"content\":\"# ПеребірСписку\\n\\n`ПеребірСписку` це клас всіх переборів списку.\\n\\n```мавка\\nклас ПеребірСписку\\n  значення\\n  список\\n  позиція\\nкінець\\n```\\n\\n```мавка\\nдія ПеребірСписку.далі()\\n```\\n\",\"path\":\"ПеребірСписку.html\"},{\"title\":\"ПеребірТексту | Документація Мавки 0.125.0\",\"content\":\"# ПеребірТексту\\n\\n`ПеребірТексту` це клас всіх переборів тексту.\\n\\n```мавка\\nклас ПеребірТексту\\n  значення\\n  текст\\n  позиція\\nкінець\\n```\\n\\n```мавка\\nдія ПеребірТексту.далі()\\n```\\n\",\"path\":\"ПеребірТексту.html\"},{\"title\":\"Послідовність | Документація Мавки 0.125.0\",\"content\":\"# Послідовність\\n\\n`Послідовність` це клас всіх послідовностей.\\n\\n```мавка\\nклас Послідовність\\n  розмір\\nкінець\\n```\\n\",\"path\":\"Послідовність.html\"},{\"title\":\"нескінченність | Документація Мавки 0.125.0\",\"content\":\"# нескінченність\\n\\n`нескінченність` це число-нескінченність ([Infinity](https://uk.wikipedia.org/wiki/IEEE_754)).\\n\\n- `ч / 0`\\n\",\"path\":\"нескінченність.html\"},{\"title\":\"невизначеність | Документація Мавки 0.125.0\",\"content\":\"# невизначеність\\n\\n`невизначеність` це число-невизначеність ([_NaN_](https://uk.wikipedia.org/wiki/NaN)).\\n\\n- `0 / 0`\\n- `нескінченність / нескінченність`\\n- `0 * нескінченність`\\n- `нескінченність + (-нескінченність)`\\n\",\"path\":\"невизначеність.html\"},{\"title\":\"друк | Документація Мавки 0.125.0\",\"content\":\"# друк\\n\\n`друк` це дія, що дозволяє виводити значення в стандартний вивід операційної системи додаючи до нього розрив рядка.\\n\\n```мавка\\nдія друк(значення)\\n```\\n\",\"path\":\"друк.html\"},{\"title\":\"Читати | Документація Мавки 0.125.0\",\"content\":\"# Читати\\n\\n```мавка\\nвзяти біб читати\\n\\nдрук(читати(\\\"введіть щось: \\\"))\\n```\\n\",\"path\":\"бібліотека-читати.html\"},{\"title\":\"Система | Документація Мавки 0.125.0\",\"content\":\"# Система\\n\\n```мавка\\nвзяти біб система\\n\\nсистема.записати(\\\"привітики\\\", \\\"./якийсь.текст\\\")\\n\\nдрук(система.прочитати(Текст, \\\"./якийсь.текст\\\"))\\n```\\n## Записати у файл\\n\\n```мавка\\n;; записує значення у файл\\n;; якщо \\\"значення\\\" є Текст, перекодування в юнікод НЕ БУДЕ\\n;;                          тобто у файл запишеться дієкод\\n;; якщо \\\"значення\\\" є Дані, буде записано без змін\\n;; якщо \\\"куди\\\" є Текст, його буде перекодовано в юнікод (юнікс, віндовс)\\nдія записати(значення, куди)\\n```\\n\\nПриклади:\\n\\n```мавка\\nд = Дані(4)\\nд[0] = 33\\nд[1] = 34\\nд[2] = 35\\nд[3] = 36\\n\\nсистема.записати(д, \\\"якісь.дані\\\")\\n```\\n\\n```мавка\\nсистема.записати(\\\"привітики\\\", \\\"./якийсь.текст\\\") ;; запишеться дієкод\\n```\\n\\n## Прочитати з файлу\\n\\n```мавка\\n;; читає весь файл\\n;; якщо \\\"тип\\\" == Текст, прочитане значення буде вернуто як текст БЕЗ ПЕРЕКОДУВАННЯ\\n;; якщо \\\"куди\\\" є Текст, його буде перекодовано в юнікод (юнікс, віндовс)\\nдія прочитати(тип, куди)\\n```\\n\\nПриклади:\\n\\n```мавка\\nзначення = система.прочитати(Дані, \\\"./якісь.дані\\\")\\n```\\n\\n```мавка\\nзначення = система.прочитати(Текст, \\\"./якийсь.текст\\\") ;; прочитається Текст БЕЗ ПЕРЕКОДУВАННЯ\\n```\\n\\n## Дописати у файл\\n\\n```мавка\\n;; дописує значення у файл\\n;; якщо \\\"значення\\\" є Текст, перекодування в юнікод НЕ БУДЕ\\n;;                          тобто у файл запишеться дієкод\\n;; якщо \\\"значення\\\" є Дані, буде дописано без змін\\n;; якщо \\\"куди\\\" є Текст, його буде перекодовано в юнікод (юнікс, віндовс)\\nдія дописати(значення, куди)\\n```\\n\\nПриклади:\\n\\n```мавка\\nд = Дані(4)\\nд[0] = 33\\nд[1] = 34\\nд[2] = 35\\nд[3] = 36\\n\\nсистема.дописати(д, \\\"./якісь.дані\\\")\\n```\\n\\n```мавка\\nсистема.дописати(\\\"привітики\\\", \\\"./якийсь.текст\\\") ;; доповниться дієкод\\n```\\n\\n## Створити папку\\n\\n```мавка\\n;; якщо \\\"шлях\\\" є Текст, його буде перекодовано в юнікод (юнікс, віндовс)\\nдія створити_папку(шлях)\\n```\\n\\nПриклади:\\n\\n```мавка\\nсистема.створити_папку(\\\"./а\\\")\\n```\\n\\n```мавка\\nсистема.створити_папку(\\\"./а/б/в\\\")\\n```\\n\\n## Видалити файл/папку\\n\\n```мавка\\n;; якщо \\\"шлях\\\" є Текст, його буде перекодовано в юнікод (юнікс, віндовс)\\nдія видалити(шлях)\\n```\\n\\nПриклади:\\n\\n```мавка\\nсистема.видалити(\\\"./якісь.дані\\\")\\n```\\n\\n\\n## Виконати команду\\n\\n```мавка\\n;; якщо \\\"команда\\\" є Текст, його буде перекодовано в юнікод (юнікс, віндовс)\\n;; якщо \\\"команда\\\" є Список в якому міститься Текст, то цей Текст буде перекодовано в юнікод (юнікс, віндовс)\\nдія виконати(команда)\\n```\\n\\nПриклади:\\n\\n```мавка\\nрезультат = система.виконати(\\\"мавка версія\\\")\\n```\\n\\n```мавка\\nрезультат = система.виконати([\\\"мавка\\\", \\\"версія\\\"])\\n```\\n\\n```мавка\\nд = Дані(2)\\nд[0] = 108\\nд[1] = 115\\n\\nрезультат = система.виконати(д)\\n```\\n\\n```мавка\\nд1 = Дані(4)\\nд1[0] = 101\\nд1[1] = 99\\nд1[2] = 104\\nд1[3] = 111\\nд2 = Дані(5)\\nд2[0] = 72\\nд2[1] = 101\\nд2[2] = 108\\nд2[3] = 108\\nд2[4] = 111\\n\\nрезультат = система.виконати([д1, д2])\\n```\\n\\n\\n```мавка\\nд1 = Дані(4)\\nд1[0] = 101\\nд1[1] = 99\\nд1[2] = 104\\nд1[3] = 111\\n\\nрезультат = система.виконати([д1, \\\"привіт\\\"])\\n```\\n\",\"path\":\"бібліотека-система.html\"},{\"title\":\"Подяка | Документація Мавки 0.125.0\",\"content\":\"# Подяка\\n\\nПереглянути перелік всіх контрибуторів Мавки відповідно до версії можна\\nв [Архіві Мавки](https://мавка.укр/архів/index.html).\\n\",\"path\":\"подяка.html\"},{\"title\":\"Післясцена | Документація Мавки 0.125.0\",\"content\":\"# Післясцена\\n\\n```ціль\\nціль Україна = створити(Рай).\\n```\\n\",\"path\":\"післясцена.html\"}]");
