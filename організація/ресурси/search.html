<script>
  const searchData = JSON.parse("[{\"title\":\"Організація Мови\",\"content\":\"> В РОЗРОБЦІ!\\n\\nОрганізація Мови це Діячі, хто обʼєдналися в єдиний Організм метою розвивати і берегти Мову.\\n\\nОрганізація Мови (далі - \\\"Організація\\\") діє за цим Словом починаючи від Дня першого голосування.\\n\\nКожен Діяч може діяти так як не перечить цьому Слову та встановленому Ладу.\\n\\nОрганізація складається з Розуму та Органів.\\n\\nРозум є Діячем, хто керує взаємодією Організації в Дійсності та відповідає за забезпечення Організації Можливостями.\\n\\nРозум обирають усі Діячі шляхом таємного голосування кожен рік починаючи від Дня першого голосування. Діяч, який отримав найбільше голосів, стає Розумом.\\n\\nСобор це Орган, що відповідає за здорову діяльність Органів.\\nСобор, отримавши згоду від Розуму, встановлює Лад, який не перечить цьому Слову.\\nСобор є порадником Розуму та допомагає йому в його діяльності.\\nСобор складається з представників Органів, хто є Діячами.\\nОдин Орган представляє рівно один Діяч.\\nДіячі обирають склад Собору кожен Рік починаючи від Дня першого голосування шляхом голосування в кожному Органі окремо.\\nУсі рішення Собору представники Органів приймають шляхом обговорення та голосування.\\n\\nСтворити новий Орган може Розум отримавши згоду від Собору.\\n\\nДолучити Діяча в Організацію може Розум.\\n\\nВилучити Діяча з Організації може Розум або Собор.\\n\\nПід час голосування за обрання Розуму голоси всіх Діячів є рівними.\\n\\nПід час голосування за обрання складу Собору голоси всіх Діячів є рівними.\\n\\nПід час голосувань Собору голоси всіх представників Органів є Рівними.\\n\\nПід час будь-якого голосування кожен Діяч може мати рівно один голос.\\n\\nСобор може оголосити Відсутність Розуму; після оголошення Собор встановлює Неповноцінний Розум, який здійснює діяльність Розуму до наступного обрання Розуму.\\n\\nЯкщо Розум чи Собор діє на шкоду Організації, Діячі повинні самоорганізуватись і шляхом відкритих обговорення та голосування обрати новий Розум та оновити склад Собору, які діятимуть до наступного Обрання.\\n\\nВ час смертельної небезпеки Дійсності усі Діячі діють з метою знищення причин та знешкодження смертельної небезпеки Дійсності.\\n\\nОрганізація відповідає лише перед Богом та Автором.\\n\\nАвтор це Богданович Давид Когут Прихожденко та Організація Мова.\\n\\n---\\n\\n> треба ще трохи краще все конкретизувати (коли рішення вважається прийнятим тощо)\\n\\n> розум має бути повідомлений щодо проблем в організації (через біль?)\\n\",\"path\":\"index.html\"}]");

  window.addEventListener("message", (event) => {
    const eventData = event.data;
    const eventId = eventData.id;
    const eventType = eventData.type;
    if (eventType === "search") {
      const query = eventData.query;
      const results = searchData.filter((item) => {
        return item.title.toLowerCase().includes(query.toLowerCase());
      });
      window.parent.postMessage(
        {
          id: eventId,
          result: results
        },
        "*"
      );
    }
  });
</script>
