<script>
  const searchData = JSON.parse("[{\"title\":\"Організація Мови\",\"content\":\"> В РОЗРОБЦІ!\\n\\nОрганізація Мови (далі - \\\"Організація\\\") це Діячі, хто обʼєдналися в єдиний Організм метою представляти Мову.\\n\\nОрганізація діє за цим Словом починаючи від Дня Першого Голосування.\\n\\nКожен Діяч може діяти так як не перечить цьому Слову та встановленому Ладу.\\n\\nОрганізація складається з Розуму та Органів.\\n\\nРозум є Діячем, хто керує взаємодією Організації в Дійсності та відповідає за забезпечення Організації Можливостями.\\n\\nРозум обирають усі Діячі шляхом Таємного Голосування кожен Рік починаючи від Дня Першого Голосування. Діяч, який отримав Найбільше Голосів, стає Розумом.\\n\\nСобор це Орган, що відповідає за здорове діяння Органів.\\nСобор, отримавши Згоду від Розуму, встановлює Лад, який не перечить цьому Слову.\\nСобор є Порадником Розуму та допомагає йому в його діяльності.\\nСобор складається з Представників Органів, хто є Діячами.\\nОдин Орган Представляє Рівно Один Діяч.\\nДіячі обирають склад Собору кожен Рік починаючи від Дня Першого Голосування шляхом Голосування в кожному Органі окремо.\\nУсі Рішення Собору Представники Органів приймають шляхом Обговорення та Голосування.\\n\\nСтворити новий Орган може Розум отримавши Згоду від Собору.\\n\\nДолучити Діяча в Організацію може Розум.\\n\\nВилучити Діяча з Організації може Розум або Собор.\\n\\nПід час Голосування Обрання Розуму Голоси всіх Діячів є Рівними.\\n\\nПід час Голосування Обрання Складу Собору Голоси всіх Діячів є Рівними.\\n\\nПід час Голосування Рішень Собору Голоси всіх Представників Органів є Рівними.\\n\\nПід час будь-якого Голосування кожен Діяч може мати Рівно Один Голос.\\n\\nСобор може оголосити Відсутність Розуму; після оголошення Собор встановлює Неповноцінний Розум, який здійснює дії Розуму до наступного Обрання Розуму.\\n\\nЯкщо Розум чи Собор діють на шкоду Організації, Діячі повинні самоорганізуватись і шляхом відкритих Обговорення та Голосування обрати новий Розум та оновити склад Собору, які діятимуть до наступного Обрання.\\n\\nВ час Смертельної Небезпеки Дійсності усі Діячі діють з метою знищення причин та знешкодження Смертельної Небезпеки Дійсності.\\n\\nОрганізація відповідає лише перед Богом та Автором.\\n\\nАвтор це Богданович Давид Когут Прихожденко та Організація Мова.\\n\\n---\\n\\n_Слово Організації Мови_\\n\\n---\\n\\n> треба ще трохи краще все конкретизувати (коли рішення вважається прийнятим тощо)\\n\\n> розум має бути повідомлений щодо проблем в організації (через біль?)\\n\",\"path\":\"index.html\"}]");

  window.addEventListener("message", (event) => {
    const eventData = event.data;
    const eventId = eventData.id;
    const eventType = eventData.type;
    if (eventType === "search") {
      const query = eventData.query;
      const results = searchData.filter((item) => {
        return item.title.toLowerCase().includes(query.toLowerCase());
      });
      window.parent.postMessage(
        {
          id: eventId,
          result: results
        },
        "*"
      );
    }
  });
</script>
