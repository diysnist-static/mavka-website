<script>
  const searchData = JSON.parse("[{\"title\":\"Бібліотека Мавки\",\"content\":\"# Бібліотека Мавки\\n\\n> НАРАЗІ НЕДОСТУПНО!\\n\\nСтворіть файл `привіт.м`:\\n\\n```мавка\\nвзяти біб афс\\n\\nафс.записати(\\\"привітики\\\", \\\"./якийсь.текст\\\", дія()\\n  афс.прочитати(Текст, \\\"./якийсь.текст\\\", дія(значення)\\n    друк(значення)\\n  кінець)\\nкінець)\\n```\\n\\nТа запустіть мавку вказавши шлях до бібліотеки:\\n\\n```sh\\nмавка -Б=./бібліотека_мавки привіт.м\\n```\\n\",\"path\":\"index.html\"},{\"title\":\"афс | Бібліотека Мавки\",\"content\":\"# афс\\n\\nАсинхронна файлова система.\\n\\n```мавка\\nвзяти біб афс\\n\\nафс.записати(\\\"привітики\\\", \\\"./якийсь.текст\\\", дія()\\n  афс.прочитати(Текст, \\\"./якийсь.текст\\\", дія(значення)\\n    друк(значення)\\n  кінець)\\nкінець)\\n```\\n\\n## Записати у файл\\n\\n```мавка\\n;; записує значення у файл\\n;; якщо \\\"значення\\\" є Текст, перекодування в юнікод НЕ БУДЕ\\n;;                          тобто у файл запишеться дієкод\\n;; якщо \\\"значення\\\" є Дані, буде записано без змін\\n;; якщо \\\"куди\\\" є Текст, його буде перекодовано в юнікод (юнікс, віндовс)\\nдія записати(значення, куди, відклик)\\n```\\n\\nПриклади:\\n\\n```мавка\\nд = Дані.виділити(4)\\nд[0] = 33\\nд[1] = 34\\nд[2] = 35\\nд[3] = 36\\n\\nафс.записати(\\n  д,\\n  \\\"якісь.дані\\\",\\n  дія(п): друк(п якщо п інакше \\\"записано!\\\")\\n)\\n```\\n\\n```мавка\\nафс.записати(\\n  \\\"привітики\\\",\\n  \\\"./якийсь.текст\\\",\\n  дія(п): друк(п якщо п інакше \\\"записано!\\\")\\n) ;; запишеться дієкод\\n```\\n\\n## Прочитати з файлу\\n\\n```мавка\\n;; читає весь файл\\n;; якщо \\\"тип\\\" == Текст, прочитане значення буде вернуто як текст БЕЗ ПЕРЕКОДУВАННЯ\\n;; якщо \\\"шлях\\\" є Текст, його буде перекодовано в юнікод (юнікс, віндовс)\\nдія прочитати(тип, шлях, відклик)\\n```\\n\\nПриклади:\\n\\n```мавка\\nафс.прочитати(\\n  Дані,\\n  \\\"./якісь.дані\\\",\\n  дія(значення, п): друк(п якщо п інакше значення)\\n)\\n```\\n\\n```мавка\\nафс.прочитати(\\n  Текст,\\n  \\\"./якийсь.текст\\\",\\n  дія(значення, п): друк(п якщо п інакше значення)\\n) ;; прочитається Текст БЕЗ ПЕРЕКОДУВАННЯ\\n```\\n\\n## Дописати у файл\\n\\n```мавка\\n;; дописує значення у файл\\n;; якщо \\\"значення\\\" є Текст, перекодування в юнікод НЕ БУДЕ\\n;;                          тобто у файл запишеться дієкод\\n;; якщо \\\"значення\\\" є Дані, буде дописано без змін\\n;; якщо \\\"куди\\\" є Текст, його буде перекодовано в юнікод (юнікс, віндовс)\\nдія дописати(значення, куди, відклик)\\n```\\n\\nПриклади:\\n\\n```мавка\\nд = Дані.виділити(4)\\nд[0] = 33\\nд[1] = 34\\nд[2] = 35\\nд[3] = 36\\n\\nафс.дописати(\\n  д,\\n  \\\"./якісь.дані\\\",\\n  дія(п): друк(п якщо п інакше \\\"дописано!\\\")\\n)\\n```\\n\\n```мавка\\nафс.дописати(\\n  \\\"привітики\\\",\\n  \\\"./якийсь.текст\\\",\\n  дія(п): друк(п якщо п інакше \\\"дописано!\\\")\\n) ;; доповниться дієкод\\n```\\n\\n## Створити папку\\n\\n```мавка\\n;; якщо \\\"шлях\\\" є Текст, його буде перекодовано в юнікод (юнікс, віндовс)\\nдія створити_папку(шлях, відклик)\\n```\\n\\nПриклади:\\n\\n```мавка\\nафс.створити_папку(\\n  \\\"./а\\\",\\n  дія(п): друк(п якщо п інакше \\\"створено!\\\")\\n)\\n```\\n\\n```мавка\\nафс.створити_папку(\\n  \\\"./а/б/в\\\",\\n  дія(п): друк(п якщо п інакше \\\"створено!\\\")\\n)\\n```\\n\\n## Видалити файл/папку\\n\\n```мавка\\n;; якщо \\\"шлях\\\" є Текст, його буде перекодовано в юнікод (юнікс, віндовс)\\nдія видалити(шлях, відклик)\\n```\\n\\nПриклади:\\n\\n```мавка\\nафс.видалити(\\n  \\\"./якісь.дані\\\",\\n  дія(видалено, п): друк(п якщо п інакше видалено)\\n)\\n```\\n\",\"path\":\"афс.html\"},{\"title\":\"інет | Бібліотека Мавки\",\"content\":\"# інет\\n\\nІнтернет (_експериментально_).\\n\\n## Запустити _TCP(eng)_ слугу\\n\\n```мавка\\nвзяти біб інет\\n\\nдія обробник_запуску(слуга, помилка)\\nкінець\\n\\nдія обробник_помилки(слуга, помилка)\\nкінець\\n\\nдія обробник_зупинки(слуга)\\nкінець\\n\\nдія обробник_підключення_звʼязку(звʼязок, слуга)\\nкінець\\n\\nдія обробник_даних_звʼязку(звʼязок, дані, слуга)\\nкінець\\n\\nдія обробник_стікання_звʼязку(звʼязок, слуга)\\nкінець\\n\\nдія обробник_закінчення_звʼязку(звʼязок, слуга)\\nкінець\\n\\nдія обробник_помилки_звʼязку(звʼязок, помилка, слуга)\\nкінець\\n\\nдія обробник_відключення_звʼязку(звʼязок, слуга)\\nкінець\\n\\nінет.служити(\\n  іа=\\\"0.0.0.0\\\",\\n  порт=8080,\\n  формат=Дані, ;; може бути Дані або Текст\\n\\n  обробник_запуску=обробник_запуску,\\n  обробник_помилки=обробник_помилки,\\n  обробник_зупинки=обробник_зупинки,\\n\\n  обробник_підключення_звʼязку=обробник_підключення_звʼязку,\\n  обробник_даних_звʼязку=обробник_даних_звʼязку,\\n  обробник_стікання_звʼязку=обробник_стікання_звʼязку,\\n  обробник_закінчення_звʼязку=обробник_закінчення_звʼязку,\\n  обробник_помилки_звʼязку=обробник_помилки_звʼязку,\\n  обробник_відключення_звʼязку=обробник_відключення_звʼязку,\\n)\\n```\\n\\n## Підключитись до _TCP(eng)_ слуги\\n\\n```мавка\\nвзяти біб інет\\n\\nдія обробник_підключення(звʼязок, помилка)\\nкінець\\n\\nдія обробник_даних(звʼязок, дані)\\nкінець\\n\\nдія обробник_стікання(звʼязок)\\nкінець\\n\\nдія обробник_закінчення(звʼязок)\\nкінець\\n\\nдія обробник_помилки(звʼязок, помилка)\\nкінець\\n\\nдія обробник_відключення(звʼязок)\\nкінець\\n\\nінет.підключитись(\\n  іа=\\\"0.0.0.0\\\",\\n  порт=8080,\\n  формат=Дані, ;; може бути Дані або Текст\\n\\n  обробник_підключення=обробник_підключення,\\n  обробник_даних=обробник_даних,\\n  обробник_стікання=обробник_стікання,\\n  обробник_закінчення=обробник_закінчення,\\n  обробник_помилки=обробник_помилки,\\n  обробник_відключення=обробник_відключення,\\n)\\n```\\n\\n## Методи класу `Звʼязок`\\n\\n```мавка\\n;; надсилає повідомлення\\n;; значення має бути даними або текстом\\n;; якщо вернулось \\\"недійсне\\\", тоді треба почекати на \\\"обробник_стікання\\\" і в ньому ще раз надіслати\\nдія надіслати(значення)\\n```\\n\\n```мавка\\n;; повідомляє про закінчення надсилання (FIN)\\n;; значення має бути даними або текстом\\nдія закінчити(значення)\\n```\\n\\n```мавка\\n;; відключає і знищує звʼязок без очікування\\nдія знищити()\\n```\\n\\n## Методи класу `Слуга`\\n\\n```мавка\\n;; зупиняє слугу і відключає клієнтів за необхідності\\nдія зупинити(закрити_підключення)\\n```\\n\",\"path\":\"інет.html\"}]");

  window.addEventListener("message", (event) => {
    const eventData = event.data;
    const eventId = eventData.id;
    const eventType = eventData.type;
    if (eventType === "search") {
      const query = eventData.query;
      const results = searchData.filter((item) => {
        return item.title.toLowerCase().includes(query.toLowerCase());
      });
      window.parent.postMessage(
        {
          id: eventId,
          result: results
        },
        "*"
      );
    }
  });
</script>
